[project]
name = "supportagent"
version = "0.1.0"
description = "SpotifyCares support agent on the TWCS dataset: intent, grounded reply, escalation, and an evaluation harness"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "joblib>=1.3",
  "pyyaml>=6",
  "openai>=1.30",
  "tqdm>=4.66",
  "requests>=2.31",
  "rouge-score>=0.1.2",
  "matplotlib>=3.8",
  "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
